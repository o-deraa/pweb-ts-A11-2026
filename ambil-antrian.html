<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ambil Nomor - Antrian Rumah Sakit</title>
  <link rel="stylesheet" href="styles/ambil-antrian.css" />
  <script src="dist/ambil-antrian.js" type="module" defer></script>
</head>
<body>
  <header class="pub-bar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><img src="icons8-hospital-64.png" alt="" width="26" height="26" /></span>
      Ambil nomor antrian
    </div>
    <div class="nav">
      <a class="btn btn-ghost sm" href="layar.html">Layar Antrian</a>
      <div class="user">
        <span class="user-badge" id="userInitial" aria-hidden="true">-</span>
        <div class="who">
          <div class="nm" id="userName">-</div>
          <div class="rl" id="userRole">-</div>
        </div>
        <button id="logoutBtn" class="btn btn-outline sm" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
          Keluar
        </button>
      </div>
    </div>
  </header>
  <main class="pub-main">
    <div id="ambilGrid" class="grid-cards"></div>
    <p id="ambilData" class="muted sm" style="margin-top:24px">Jenis antrian baru muncul otomatis.</p>
  </main>

  <div id="ticketOverlay" class="ambil-overlay" role="dialog" aria-modal="true" aria-live="assertive" aria-labelledby="ovLab">
    <div>
      <div class="ov-lab" id="ovLab">Nomor antrian Anda</div>
      <div class="ov-num" id="ovNum">-</div>
      <div class="ov-name" id="ovName">atas nama -</div>
      <div class="ov-prio" id="ovPrio">Normal</div>
      <div class="ov-msg">Silakan Menunggu</div>
      <div class="ov-hint">Layar menutup otomatis. Ketuk untuk menutup.</div>
    </div>
  </div>
</body>
</html>
