<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Layar Antrian - Antrian Rumah Sakit</title>
  <link rel="stylesheet" href="styles/layar.css" />
  <script src="dist/layar.js" type="module" defer></script>
</head>
<body>
  <header class="pub-bar layar-bar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><img src="icons8-hospital-64.png" alt="" width="26" height="26" /></span>
      Nomor sedang dipanggil
    </div>
    <div class="layar-stamp">
      <span class="stamp-lab">Diperbarui</span>
      <span class="stamp-time" id="updatedAt">--.--.--</span>
    </div>
    <div class="nav">
      <a class="btn btn-ghost sm" href="ambil-antrian.html">Ambil Nomor</a>
      <div class="user" id="userBlock">
        <span class="user-badge" id="userInitial" aria-hidden="true">-</span>
        <div class="who">
          <div class="nm" id="userName">-</div>
          <div class="rl" id="userRole">-</div>
        </div>
        <button id="logoutBtn" class="btn btn-outline sm" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
          Keluar
        </button>
      </div>
    </div>
  </header>
  <main>
    <div id="layarGrid" class="layar-main"></div>
  </main>

  <button id="fsBtn" class="fs-float" type="button" aria-label="Layar penuh" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4H4v5"/><path d="M15 4h5v5"/><path d="M9 20H4v-5"/><path d="M15 20h5v-5"/></svg>
  </button>
</body>
</html>
