<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Admin - Antrian Rumah Sakit</title>
  <link rel="stylesheet" href="styles/admin.css" />
  <script src="dist/admin.js" type="module" defer></script>
</head>
<body>
  <div class="app">
    <header class="topnav">
      <div class="brand-wrap">
        <span class="brand-mark" aria-hidden="true"><img src="icons8-hospital-64.png" alt="" width="26" height="26" /></span>
        Antrian Tiket
      </div>
      <nav class="nav-links" aria-label="Navigasi utama">
        <a class="active" href="index.html" aria-current="page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          Dashboard
        </a>
        <a href="operator.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg>
          Operator
        </a>
        <a href="layar.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="12" rx="1"/><path d="M8 20h8M12 16v4"/></svg>
          Layar Antrian
        </a>
      </nav>
      <div class="user">
        <span class="user-badge" id="userInitial" aria-hidden="true">-</span>
        <div class="who">
          <div class="nm" id="userName">-</div>
          <div class="rl" id="userRole">-</div>
        </div>
        <button id="logoutBtn" class="btn btn-outline sm" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
          Keluar
        </button>
      </div>
    </header>

    <main class="content">
      <div class="page-head">
        <div>
          <h2>Dashboard Admin</h2>
          <p class="muted sm">Reset setiap hari agar penomoran antrian mulai dari awal.</p>
        </div>
      </div>

      <div id="kpiRow" class="kpi-row"></div>

      <div class="grid-2">
        <section class="card">
          <div class="sec-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
            <h3>Jenis antrian</h3>
          </div>
          <form id="jenisForm" class="form-stack">
            <div class="row">
              <div class="field-group">
                <label for="kode">Kode</label>
                <input id="kode" class="input" type="text" maxlength="1" placeholder="C" style="width:68px;text-transform:uppercase" required />
              </div>
              <div class="field-group" style="flex:1;min-width:150px">
                <label for="nama">Nama layanan</label>
                <input id="nama" class="input" type="text" placeholder="Contoh: Farmasi" required />
              </div>
              <button class="btn btn-primary" type="submit">Tambah</button>
            </div>
          </form>
          <div id="jenisError" class="sm" style="color:var(--color-danger-text);min-height:1em"></div>
          <div id="jenisList" class="list-striped"></div>
        </section>

        <section class="card">
          <div class="sec-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg>
            <h3>Terbitkan tiket manual</h3>
          </div>
          <form id="issueForm" class="form-stack">
            <div class="row">
              <div class="field-group" style="flex:1;min-width:150px">
                <label for="issueKode">Jenis antrian</label>
                <select id="issueKode" class="input" required></select>
              </div>
              <div class="field-group">
                <label for="issuePrioritas">Prioritas</label>
                <select id="issuePrioritas" class="input"></select>
              </div>
              <div class="field-group" style="flex:1;min-width:150px">
                <label for="issueNama">Atas nama</label>
                <input id="issueNama" class="input" type="text" placeholder="Nama pasien" autocomplete="off" required />
              </div>
              <button class="btn btn-primary" type="submit">Terbitkan</button>
            </div>
          </form>
          <div id="issueError" class="sm" style="color:var(--color-danger-text);min-height:1em"></div>
          <div id="tiketList"></div>
        </section>
      </div>

      <section class="danger-zone">
        <div class="dz-text">
          <h3>Reset Antrian</h3>
          <p>Menghapus seluruh tiket aktif dan mengembalikan penomoran ke awal. Tindakan ini tidak bisa dibatalkan.</p>
        </div>
        <button id="resetBtn" class="btn btn-danger" type="button">Reset Antrian</button>
      </section>
    </main>
  </div>
</body>
</html>
